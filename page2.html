<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Info</title>
    <style>
      body {
        background-color: #f779a6;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .button {
        font-size: 20px;
        background-color: #fbc2d7;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        color: #333;
        transition: background-color 0.2s ease;
      }
      .button:hover {
        background-color: #f9a3c0;
      }
      #myText {
        background-color: white;
        padding: 15px 20px;
        border-radius: 12px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        margin-top: 20px;
        max-width: 400px;
        text-align: center;
        color: #333;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center; color: white">Hi love!🤗</h1>

    <div style="text-align: center">
      <button class="button" onclick="toggleText()">
        Click Me to Show/Hide Text
      </button>
      <div id="myText" style="display: none">
        <h3>Hi love</h3>
        <div style="text-align: center; font-size:">
          <a href="page3.html">
            <button class="button">click here</button>
          </a>
        </div>
      </div>
    </div>

    <script>
      /* JavaScript function to toggle the text visibility */
      function toggleText() {
        var x = document.getElementById("myText");
        if (x.style.display === "none" || x.style.display === "") {
          x.style.display = "block";
        } else {
          x.style.display = "none";
        }
      }
    </script>
  </body>
</html>
